name: Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
      - stage

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Determine stack name
        id: stack
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "stack_name=bucstop-pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "stack_name=bucstop" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "stage" ]]; then
            echo "stack_name=bucstop-stage" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported ref/event"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.DEPLOY_ROLE }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: ./deploy/deploy.sh "${{ steps.stack.outputs.stack_name }}"
