name: Create and route PBI issues

on:
  push:
    branches: [main, automate-pbis]
    paths:
      - 'pbis/*.md'

permissions:
  contents: read
  issues: write

jobs:
  create-pbis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create PBIs in both backlog intake columns
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token with project read/write access to both organization projects.
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PRODUCT_BACKLOG_NAME: Product Backlog
          SPRINT_BACKLOG_NAME: Sprint Backlog
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: node scripts/parseAndCreatePBIs.cjs
