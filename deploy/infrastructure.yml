AWSTemplateFormatVersion: '2010-09-09'
Description: BucHunt static website infrastructure

Parameters:
  EnvironmentName:
    Type: String
    Default: production
  AdminCodeBucket:
    Type: String
    Description: Private S3 bucket containing the compiled administrative Lambda ZIP
  AdminCodeKey:
    Type: String
    Description: Immutable S3 object key for the administrative Lambda ZIP
  GoogleClientId:
    Type: String
    Default: ''
    Description: Google Identity Services Web application OAuth client ID
  AdminEmails:
    Type: String
    Default: ''
    Description: Comma-separated verified Google email addresses allowed administrator access; empty permits regular sign-in with no administrators

Resources:

  AdminSessions:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  AdminApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-admin'
      ProtocolType: HTTP

  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: AdminSessions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt AdminSessions.Arn

  AdminFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: admin.handler
      Role: !GetAtt AdminRole.Arn
      Timeout: 15
      MemorySize: 128
      Code:
        S3Bucket: !Ref AdminCodeBucket
        S3Key: !Ref AdminCodeKey
      Environment:
        Variables:
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          ADMIN_EMAILS: !Ref AdminEmails
          ADMIN_SESSION_TABLE: !Ref AdminSessions
          ADMIN_ORIGIN: !Sub 'https://${CloudFrontDistribution.DomainName}'

  AdminIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminFunction.Arn
      PayloadFormatVersion: '2.0'

  AdminRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: ANY /api/admin/{proxy+}
      Target: !Join ['/', [integrations, !Ref AdminIntegration]]

  AdminRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: ANY /api/admin
      Target: !Join ['/', [integrations, !Ref AdminIntegration]]

  AuthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: ANY /api/auth/{proxy+}
      Target: !Join ['/', [integrations, !Ref AdminIntegration]]

  AuthRootRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: ANY /api/auth
      Target: !Join ['/', [integrations, !Ref AdminIntegration]]

  AdminStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AdminApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  AdminInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*/*/api/admin*'

  AuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*/*/api/auth*'

  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-OAC'
        Description: Access control for BucHunt S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html

        Origins:
          - Id: AdminApiOrigin
            DomainName: !Sub '${AdminApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true

          AllowedMethods:
            - GET
            - HEAD

          CachedMethods:
            - GET
            - HEAD

          ForwardedValues:
            QueryString: true

        PriceClass: PriceClass_100
        CacheBehaviors:
          - PathPattern: /api/auth*
            TargetOriginId: AdminApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed CachingDisabled and AllViewerExceptHostHeader policies.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /api/admin*
            TargetOriginId: AdminApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS managed CachingDisabled and AllViewerExceptHostHeader policies.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

Outputs:

  AdminUrl:
    Description: Google sign-in and administrative access page
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}/admin.html'

  BucketName:
    Description: S3 bucket containing the BucHunt website
    Value: !Ref WebsiteBucket

  DistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution

  SiteUrl:
    Description: CloudFront website URL
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
