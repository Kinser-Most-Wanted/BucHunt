<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player tasks | BucHunt</title>
    <link rel="stylesheet" href="./css/foundation.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="./index.html">BucHunt</a>
      <nav aria-label="Main navigation">
        <a href="./index.html">Home</a><a href="./admin.html">Administration</a
        ><a href="./player.html">Player tasks</a>
      </nav>
    </header>
    <main>
      <h1>Hunt tasks</h1>
      <p class="notice">
        Google sign-in identifies the player for this prototype. Active hunt
        enrollment and server verification are not implemented yet.
      </p>
      <section
        id="display-tasks"
        data-testid="display-tasks"
        data-google-client-id="YOUR_GOOGLE_CLIENT_ID"
      >
        <h2>Sign in to see active Hunts</h2>
        <p data-testid="player-account" hidden></p>
        <div data-testid="google-sign-in" aria-label="Sign in with Google"></div>
        <button type="button" data-testid="player-sign-out" hidden>
          Sign out
        </button>
        <p
          class="field-help"
          data-testid="player-provider-status"
          role="status"
          hidden
        ></p>
        <p role="status" data-testid="player-task-status" aria-live="polite">
          No tasks loaded.
        </p>
        <ul
          data-testid="player-hunt-list"
          aria-label="Active Hunts"
          class="player-hunt-list"
        ></ul>
      </section>
    </main>
    <footer>Sprint 2 foundation · Features awaiting implementation</footer>
    <script
      id="google-identity-script"
      src="https://accounts.google.com/gsi/client"
      async
      defer
    ></script>
    <script type="module" src="./js/foundation/bootstrap.js"></script>
  </body>
</html>
